# One pipeline run = one AOI + one date window.
run_id: kasur-2025-12
aoi:
  name: Kasur District
  geojson: config/aoi_kasur.geojson

imagery:
  stac_url: https://planetarycomputer.microsoft.com/api/stac/v1
  collection: sentinel-2-l2a
  window: ["2025-12-01", "2025-12-31"]   # Nov-Feb matches training season
  max_cloud_pct: 20
  # Training tiles came from GEE downloads in EPSG:4326 at scale 10 -> square pixels of
  # 10/111319.49 degrees (10 m N-S, ~8.6 m E-W at Kasur). Use the same grid for inference.
  crs: EPSG:4326
  resolution: 0.0000898315284             # degrees per pixel
  metric_crs: EPSG:32643                  # UTM 43N for areas, distances, NMS
  bands: [B04, B03, B02]                  # RGB order - must match training
  scl_mask_classes: [3, 8, 9, 10]         # shadow, cloud med/high, cirrus
  boa_offset: 1000                        # L2A baseline >= 04.00 adds +1000; subtract it

tiles:
  size_px: 128
  stride_px: 98                           # 30 px overlap
  scaling: per_tile_minmax                # see CLAUDE.md "Domain matching"

model:
  path: models/kiln_v1.pt
  imgsz: 256
  conf: 0.25                              # frozen kiln_v1 operating point (see models/kiln_v1.json)

merge:
  nms_iou: 0.3
  min_area_m2: 1000                       # FCBK ~10x4 px = ~4000 m2; keep margin for small kilns
  max_area_m2: 40000

track:
  match_meters: 60
  match_iou: 0.2
  type_history: 3
  h3_resolution: 10

risk:                                     # priority score, not proof
  w_non_zigzag: 50
  w_thermal: 30
  w_ban_window: 20
  thermal_dt_center_k: 2.0
  thermal_dt_scale_k: 1.5
